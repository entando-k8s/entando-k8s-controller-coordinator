# Quarkus Logging Configuration
# Set root log level
quarkus.log.level=INFO

# Enable DEBUG logging for Entando controller coordinator packages
quarkus.log.category."org.entando.kubernetes.controller.coordinator".level=FINE
quarkus.log.category."org.entando.kubernetes.controller".level=DEBUG
quarkus.log.category."org.entando.kubernetes".level=DEBUG

# Enable TRACE for the most detailed logs (uncomment if needed)
# quarkus.log.category."org.entando.kubernetes.controller.coordinator".level=ALL

# Console logging configuration
quarkus.log.console.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.console.level=DEBUG

# Show the resource processing details
quarkus.log.category."org.entando.kubernetes.controller.coordinator.EntandoResourceObserver".level=FINE
quarkus.log.category."org.entando.kubernetes.controller.coordinator.EntandoOperatorMatcher".level=FINE
quarkus.log.category."org.entando.kubernetes.controller.coordinator.ControllerCoordinatorProcessingCriteria".level=FINE

# Kubernetes client logging (set to INFO to avoid too much noise, change to DEBUG if needed)
quarkus.log.category."io.fabric8.kubernetes".level=INFO